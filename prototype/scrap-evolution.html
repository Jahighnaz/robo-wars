<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scrap Evo">
<meta name="theme-color" content="#1f262e">
<title>Scrap Evolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#1f262e; --panel:#28313b; --panel2:#323d49; --steel:#5b6673; --line:#3f4b58;
  --text:#ece7dc; --muted:#a3aab3; --yellow:#f6c344; --oxide:#c4533a; --teal:#4fa69a;
  --font:'Chakra Petch', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ground:#1f262e; --text:#ece7dc; } }
:root[data-theme="dark"]{ --ground:#1f262e; --text:#ece7dc; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; background:var(--ground); color:var(--text); font-family:var(--font); overflow:hidden;
  touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
canvas#cv{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
button{ font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
button:focus-visible{ outline:2px solid var(--yellow); outline-offset:2px; }

/* HUD */
#hud{ position:fixed; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 14px) 0 calc(env(safe-area-inset-left,0px) + 14px);
  display:none; pointer-events:none; }
#hud.on{ display:block; }
.hudrow{ display:flex; align-items:center; gap:12px; }
#hTime{ font-size:22px; font-weight:700; min-width:64px; }
#hWave{ font-size:14px; color:var(--muted); }
#xpwrap{ flex:1; height:10px; background:rgba(0,0,0,.35); border-radius:5px; overflow:hidden; position:relative; }
#xpbar{ height:100%; width:0; background:var(--teal); }
#hLvl{ font-size:15px; font-weight:700; min-width:52px; text-align:right; }
#pauseBtn{ pointer-events:auto; width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:rgba(40,49,59,.85); font-size:18px; font-weight:700; }
#hBottom{ position:fixed; left:0; right:0; bottom:0; padding:0 calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 14px);
  display:none; pointer-events:none; gap:14px; align-items:flex-end; flex-wrap:wrap; }
#hBottom.on{ display:flex; }
#cabwrap{ width:180px; }
#cablbl{ font-size:12px; color:var(--muted); margin-bottom:3px; }
#cabbarbg{ height:10px; background:rgba(0,0,0,.35); border-radius:5px; overflow:hidden; }
#cabbar{ height:100%; width:100%; background:var(--yellow); }
#hLoot{ display:flex; gap:10px; font-size:14px; flex-wrap:wrap; }
.lootchip{ display:flex; align-items:center; gap:4px; background:rgba(0,0,0,.3); padding:3px 8px; border-radius:8px; }
.dot{ width:9px; height:9px; border-radius:2px; display:inline-block; }
#bossbar{ position:fixed; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top,0px) + 64px); width:min(520px,80vw); display:none; pointer-events:none; text-align:center; }
#bossbar.on{ display:block; }
#bossname{ font-size:14px; font-weight:700; color:var(--oxide); margin-bottom:3px; }
#bossbg{ height:8px; background:rgba(0,0,0,.4); border-radius:4px; overflow:hidden; }
#bossfill{ height:100%; background:var(--oxide); width:100%; }
#toast{ position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 96px); transform:translateX(-50%); background:rgba(31,38,46,.92); border:1px solid var(--line);
  padding:8px 16px; border-radius:10px; font-size:15px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:86vw; text-align:center; }
#toast.on{ opacity:1; }

/* Overlay screens */
#ui{ position:fixed; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y;
  padding:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-right,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 24px) calc(env(safe-area-inset-left,0px) + 18px); }
#ui.hidden{ display:none; }
#ui.dim{ background:rgba(20,25,31,.82); }
#ui.solid{ background:var(--ground); }
.wrap{ max-width:980px; margin:0 auto; }
h1{ font-size:clamp(34px,6vw,56px); line-height:1; margin:8px 0 4px; letter-spacing:.5px; }
h1 .bolt{ color:var(--yellow); }
h2{ font-size:22px; margin:22px 0 10px; }
h3{ font-size:17px; margin:0 0 6px; }
p{ line-height:1.45; }
.sub{ color:var(--muted); font-size:15px; margin:0 0 16px; max-width:60ch; }
.btn{ border:1px solid var(--line); background:var(--panel2); border-radius:12px; padding:12px 18px; font-size:16px; font-weight:700; min-height:48px; }
.btn.primary{ background:var(--yellow); color:#26200c; border-color:var(--yellow); }
.btn.ghost{ background:transparent; }
.btn:disabled{ opacity:.4; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.resbar{ display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 4px; }
.res{ display:flex; align-items:center; gap:6px; background:var(--panel); border-radius:9px; padding:6px 10px; font-size:14px; }
.worlds{ display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:14px; }
.world{ background:var(--panel); border-radius:16px; padding:16px; border:1px solid var(--line); display:flex; flex-direction:column; gap:10px; }
.world .meta{ font-size:13px; color:var(--muted); }
.profile{ display:flex; flex-direction:column; gap:4px; }
.prow{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
.prow .lbl{ width:86px; }
.prow .bar{ height:6px; border-radius:3px; }
.species{ font-size:13px; color:var(--muted); line-height:1.5; }
.species b{ color:var(--text); font-weight:500; }
details summary{ cursor:pointer; font-size:14px; color:var(--teal); }
.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:12px; }
.card{ text-align:left; background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:18px; min-height:150px; display:flex; flex-direction:column; gap:8px; }
.card .kind{ font-size:13px; color:var(--muted); }
.card .ttl{ font-size:20px; font-weight:700; }
.card .dsc{ font-size:15px; color:var(--muted); line-height:1.4; }
.card.k-block{ border-color:var(--yellow); }
.card.k-up{ border-color:var(--teal); }
.card.k-repair{ border-color:#7bc96f; }
.center{ text-align:center; }
.mid{ min-height:100%; display:flex; flex-direction:column; justify-content:center; }

/* Build grid (garage + placement) */
.gridwrap{ display:flex; justify-content:center; padding:14px; background:
  radial-gradient(circle, rgba(236,231,220,.09) 1.2px, transparent 1.4px) 0 0/16px 16px, var(--panel); border-radius:18px; border:1px solid var(--line); }
.bgrid{ display:grid; gap:4px; }
.cell{ width:var(--cs); height:var(--cs); border-radius:8px; border:1px solid rgba(255,255,255,.06); background:rgba(0,0,0,.18); position:relative;
  display:flex; align-items:center; justify-content:center; font-size:calc(var(--cs) * .3); font-weight:700; padding:0; }
.cell.valid{ border:2px dashed var(--yellow); background:rgba(246,195,68,.08); }
.cell.blk{ color:#1b1e22; border:1px solid rgba(0,0,0,.35); }
.cell.cab{ box-shadow:inset 0 0 0 3px rgba(0,0,0,.35); }
.cell.fresh{ outline:3px solid var(--yellow); outline-offset:1px; }
.cell .arw{ position:absolute; top:2px; left:50%; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:8px solid rgba(0,0,0,.55); transform-origin:50% calc(var(--cs) / 2 - 2px); margin-left:-6px; }
.cell .hpb{ position:absolute; left:4px; right:4px; bottom:3px; height:3px; background:rgba(0,0,0,.35); border-radius:2px; overflow:hidden; }
.cell .hpb i{ display:block; height:100%; background:#1b1e22; }
.fwd{ text-align:center; font-size:13px; color:var(--muted); margin-bottom:6px; }
.garage{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:start; }
@media (max-width:760px){ .garage{ grid-template-columns:1fr; } }
.tools{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.tool{ border:1px solid var(--line); background:var(--panel2); border-radius:10px; padding:8px 10px; font-size:14px; display:flex; gap:6px; align-items:center; min-height:44px; }
.tool.sel{ border-color:var(--yellow); box-shadow:0 0 0 2px var(--yellow); }
.tool .sw{ width:14px; height:14px; border-radius:4px; }
.stats{ font-size:14px; color:var(--muted); margin-top:12px; line-height:1.6; }
.stats b{ color:var(--text); }
.warn{ color:var(--oxide); }
.craft{ display:flex; flex-direction:column; gap:8px; }
.crow{ display:flex; align-items:center; gap:10px; background:var(--panel); border-radius:12px; padding:10px 12px; border:1px solid var(--line); }
.crow .nm{ flex:1; min-width:0; }
.crow .nm div{ font-size:12px; color:var(--muted); line-height:1.35; }
.cost{ display:flex; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:3px; }
.crow .btn{ padding:8px 12px; min-height:40px; font-size:14px; }
.log{ background:var(--panel); border-radius:14px; padding:14px 16px; border:1px solid var(--line); font-size:15px; line-height:1.55; }
.log div{ padding:3px 0; }
textarea{ width:100%; min-height:110px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; font:13px ui-monospace,monospace; user-select:text; -webkit-user-select:text; touch-action:auto; }
.rep{ display:flex; flex-direction:column; gap:8px; }
.rrow{ display:grid; grid-template-columns:150px 1fr 120px; gap:10px; align-items:center; font-size:14px; }
.rrow .nm{ display:flex; align-items:center; gap:8px; min-width:0; }
.rrow .track{ height:12px; background:rgba(0,0,0,.3); border-radius:6px; overflow:hidden; }
.rrow .fill{ height:100%; border-radius:6px; }
.rrow .num{ text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
.rrow .num b{ color:var(--text); }
@media (max-width:520px){ .rrow{ grid-template-columns:110px 1fr 92px; font-size:13px; } }
.mk{ font-size:12px; color:var(--yellow); margin-left:4px; }
.howto{ font-size:15px; color:var(--muted); line-height:1.55; max-width:62ch; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="hudrow">
    <div><div id="hTime">0:00</div><div id="hWave">Wave 1</div></div>
    <div id="xpwrap"><div id="xpbar"></div></div>
    <div id="hLvl">Lv 1</div>
    <button id="pauseBtn" aria-label="Pause">II</button>
  </div>
</div>
<div id="bossbar"><div id="bossname"></div><div id="bossbg"><div id="bossfill"></div></div></div>
<div id="hBottom">
  <div id="cabwrap"><div id="cablbl">Cab integrity</div><div id="cabbarbg"><div id="cabbar"></div></div></div>
  <div id="hLoot"></div>
</div>
<div id="toast"></div>
<div id="ui" class="solid"></div>

<script>
'use strict';
/* ======================= Utilities ======================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let R = mulberry((Date.now() ^ 0x5bd1e995) >>> 0);
const rand = (a, b) => a + (b - a) * R();
const pick = arr => arr[Math.floor(R() * arr.length)];
function wpick(obj) { let s = 0; for (const k in obj) s += Math.max(0, obj[k]); let r = R() * s; for (const k in obj) { r -= Math.max(0, obj[k]); if (r <= 0) return k; } return Object.keys(obj)[0]; }
function swapRemove(arr, i) { arr[i] = arr[arr.length - 1]; arr.pop(); }
const fmtTime = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
const roman = n => ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'][clamp(n - 1, 0, 11)];

/* ======================= Data ======================= */
const CS = 18;          // player block size (world units)
const EC = 9;           // enemy block size
const STEP = 1 / 60;
const ARENA = 2200;     // half size of the arena
const RUN_LEN = 300;    // boss arrives at 5:00
const MAX_E = 220;
const TESLA_FALLOFF = 0.9;  // damage share for each chained jump
const TESLA_JUMP = 175;     // max distance of a chain jump

const RES = {
  scrap:  { name: 'Scrap',        color: '#b8a07a' },
  copper: { name: 'Copper',       color: '#e07b39' },
  resin:  { name: 'Bio-resin',    color: '#7bc96f' },
  crystal:{ name: 'Cryo-crystal', color: '#7fd3f0' },
  pyro:   { name: 'Pyro-ore',     color: '#ff5a3c' },
  shard:  { name: 'Core shard',   color: '#d78bff' },
};
const DTYPES = ['kinetic', 'explosive', 'fire', 'energy', 'electric'];
const DCOL = { kinetic: '#ffd27a', explosive: '#ff9a4a', fire: '#ff6a3c', energy: '#7fe3ff', electric: '#c3b2ff' };

// Player blocks. dir = weapon follows block facing. arc in degrees.
const B = {
  cab:    { name: 'Cab', ab: 'C', cat: 'cab', hp: 170, mass: 3, power: 6, color: '#f6c344', desc: 'The core. If it breaks, the run ends.' },
  wheel:  { name: 'Wheel', ab: 'W', cat: 'prop', hp: 45, mass: 1, thrust: 7, turn: 3.6, color: '#8d96a3', desc: 'Light and quick. Slow in mud.', cost: { scrap: 20 } },
  track:  { name: 'Track', ab: 'T', cat: 'prop', hp: 85, mass: 2, thrust: 9, turn: 4.6, mud: true, color: '#6c7684', desc: 'Ignores mud and grips on ice.', cost: { scrap: 30, copper: 10 } },
  hover:  { name: 'Hover pad', ab: 'H', cat: 'prop', hp: 30, mass: 0.6, thrust: 6, turn: 4.0, hover: true, power: -1, color: '#5ad1c8', desc: 'Floats over lava.', cost: { crystal: 15, copper: 10 } },
  armor:  { name: 'Armor plate', ab: 'A', cat: 'armor', hp: 120, mass: 2, color: '#b7bcc4', desc: 'Absorbs 40% of hits on neighbouring blocks.', cost: { scrap: 25 } },
  regen:  { name: 'Regen moss', ab: 'M', cat: 'armor', hp: 80, mass: 1, regen: 4, color: '#7bc96f', desc: 'Armor that regrows 4 HP/s.', cost: { resin: 20, scrap: 10 } },
  cannon: { name: 'Autocannon', ab: 'AC', cat: 'weapon', hp: 50, mass: 1.5, power: -1, dir: true, color: '#e8cf7a', desc: 'Steady kinetic fire in its facing. Neighbouring cannons fire faster.',
            w: { type: 'kinetic', dmg: 11, rate: 4.5, range: 300, arc: 130, speed: 680, spread: 0.06 }, cost: { scrap: 30 } },
  shotgun:{ name: 'Scattergun', ab: 'SG', cat: 'weapon', hp: 55, mass: 1.5, power: -1, dir: true, color: '#d9a85a', desc: 'Close-range pellet burst.',
            w: { type: 'kinetic', dmg: 10, rate: 1.6, range: 230, arc: 140, speed: 600, spread: 0.42, pellets: 6 }, cost: { scrap: 35 } },
  laser:  { name: 'Laser', ab: 'L', cat: 'weapon', hp: 40, mass: 1, power: -2, dir: true, color: '#7fe3ff', desc: 'Instant long-range energy beam. +20% damage per adjacent battery.',
            w: { type: 'energy', dmg: 30, rate: 1.4, range: 360, arc: 70, beam: true }, cost: { crystal: 20, copper: 10 } },
  tesla:  { name: 'Tesla coil', ab: 'Z', cat: 'weapon', hp: 45, mass: 1.5, power: -2, color: '#c3b2ff', desc: '360° lightning that chains to 3 more enemies. +1 chain per adjacent battery.',
            w: { type: 'electric', dmg: 13, rate: 1.2, range: 220, arc: 360, chain: 3 }, cost: { copper: 30 } },
  flamer: { name: 'Flamer', ab: 'F', cat: 'weapon', hp: 50, mass: 1.5, power: -1, dir: true, color: '#ff7a4a', desc: 'Short cone of fire that sets enemies burning.',
            w: { type: 'fire', dmg: 7, rate: 10, range: 185, arc: 80, speed: 340, spread: 0.3, burn: 16, life: 0.55, pierce: 2 }, cost: { pyro: 25, scrap: 10 } },
  mortar: { name: 'Mortar', ab: 'MO', cat: 'weapon', hp: 60, mass: 2.5, power: -1, color: '#ff9a4a', desc: '360° lobbed shells with splash damage.',
            w: { type: 'explosive', dmg: 26, rate: 0.7, range: 400, arc: 360, lob: true, aoe: 70 }, cost: { pyro: 20, scrap: 20 } },
  battery:{ name: 'Battery', ab: 'B', cat: 'energy', hp: 40, mass: 1, power: 4, color: '#9be37b', desc: '+4 power. Boosts adjacent lasers and Tesla coils.', cost: { copper: 20 } },
  magnet: { name: 'Magnet', ab: 'MG', cat: 'util', hp: 40, mass: 1, magnet: 90, color: '#e05a7a', desc: '+90 pickup range.', cost: { copper: 15, scrap: 10 } },
  repair: { name: 'Repair arm', ab: 'R', cat: 'util', hp: 45, mass: 1, power: -1, repair: 7, color: '#f0e68c', desc: 'Repairs adjacent blocks by 7 HP/s.', cost: { resin: 25 } },
};
const PLACEABLE = Object.keys(B).filter(k => k !== 'cab');
const UP_MAX = 5;
const upL = t => (save && save.up && save.up[t]) || 0;
function upCost(t) {
  const L = upL(t); const base = B[t].cost || { scrap: 50, copper: 20 }; const c = {};
  for (const r in base) c[r] = Math.ceil(base[r] * 1.5 * (L + 1));
  if (L >= 2) c.shard = L - 1;
  return c;
}
function upEffect(t) {
  const d = B[t]; const parts = ['+20% HP'];
  if (d.w) parts.push('+15% damage', '+5% fire rate');
  if (d.thrust) parts.push('+8% thrust');
  if (t === 'battery' || t === 'cab') parts.push('+1 power');
  if (d.magnet) parts.push('+25 pickup range');
  if (d.regen || d.repair) parts.push('+25% healing');
  return parts.join(', ') + ' per level';
}

// Enemy blocks (enemies are built from the same idea)
const EB = {
  core:     { hp: 20, mass: 1,   color: '#c4533a', mat: 'scrap' },
  spike:    { hp: 8,  mass: 0.5, melee: 6,  color: '#ece7dc', mat: 'scrap' },
  plate:    { hp: 30, mass: 1.5, color: '#7d848d', mat: 'scrap' },
  gun:      { hp: 10, mass: 0.8, gun: 6,   color: '#e3c25a', mat: 'copper' },
  boomer:   { hp: 6,  mass: 0.6, boom: 24, color: '#ff7a3c', mat: 'pyro' },
  thruster: { hp: 6,  mass: 0.4, thrust: 1, color: '#6fc3ff', mat: 'copper' },
  fireplate:{ hp: 22, mass: 1.2, res: { fire: 0.4 }, color: '#b5462e', mat: 'pyro' },
  insul:    { hp: 22, mass: 1.2, res: { electric: 0.25, energy: 0.2 }, color: '#6aa9c9', mat: 'crystal' },
  reactive: { hp: 24, mass: 1.4, res: { explosive: 0.4, kinetic: 0.15 }, color: '#8fa36a', mat: 'resin' },
};
const EB_LABEL = { core: 'core', spike: 'spike', plate: 'plate', gun: 'gun', boomer: 'bomb', thruster: 'thruster', fireplate: 'heat plating', insul: 'insulation', reactive: 'reactive plating' };

const WORLDS = {
  rust: {
    name: 'Rustlands', hazard: 'mud', hazardText: 'Mud pools slow wheels. Tracks drive through.',
    ground: '#262320', dot: '#3a332b', haz: 'rgba(120,88,52,0.55)',
    res: { scrap: 6, copper: 2, resin: 2, crystal: 0.4, pyro: 0.8 },
    seeds: [
      { name: 'Skitter Ripper', cells: [[0,0,'core'],[0,-1,'spike']] },
      { name: 'Rust Hulk', cells: [[0,0,'core'],[0,-1,'spike'],[-1,0,'plate'],[1,0,'plate'],[0,1,'plate']] },
      { name: 'Bolt Spitter', cells: [[0,0,'core'],[0,-1,'gun'],[0,1,'thruster']], pref: 200 },
      { name: 'Fuse Popper', cells: [[0,0,'core'],[0,-1,'boomer'],[0,1,'thruster'],[1,0,'thruster']] },
      { name: 'Dart Ripper', cells: [[0,0,'core'],[0,-1,'spike'],[0,1,'thruster']] },
    ],
  },
  tundra: {
    name: 'Crystal Tundra', hazard: 'ice', hazardText: 'Ice sheets make you drift. Tracks keep grip.',
    ground: '#1d2630', dot: '#2c3a48', haz: 'rgba(160,215,240,0.22)',
    res: { scrap: 1.6, copper: 1.2, resin: 0.6, crystal: 6, pyro: 0.4 },

          for (const b of V.list.slice()) { const bd = Math.hypot(b.wx - e.x, b.wy - e.y); if (bd < 50) hitPlayer(b, e.boom * (1 - bd / 70), e.sp); if (G.over) return; }
          ring(e.x, e.y, 50, '#ff7a3c'); burst(e.x, e.y, 12, '#ff7a3c', 200);
          e.dead = true; e.sp.st.life += G.t - e.t0; continue;
        }
        hitPlayer(nb.b, e.melee * dt * 0.8, e.sp);
        if (G.over) return;
        const push = (CS * 0.62 + e.r - nb.d);
        const ux = (e.x - nb.b.wx) / (nb.d || 1), uy = (e.y - nb.b.wy) / (nb.d || 1);
        e.x += ux * push; e.y += uy * push;
      }
    }
    // shooting
    if (e.gun > 0) {
      e.cd -= dt;
      if (e.cd <= 0 && d < 420) {
        e.cd = e.bossLv ? 1.3 : 1.8;
        const n = e.bossLv === 2 ? 3 : e.bossLv ? 2 : 1;
        const base = Math.atan2(dy, dx);
        for (let j = 0; j < n; j++) {
          const ang = base + (n > 1 ? (j - (n - 1) / 2) * 0.22 : rand(-0.05, 0.05));
          EBL.push({ x: e.x, y: e.y, vx: Math.cos(ang) * 240, vy: Math.sin(ang) * 240, dmg: e.gun, life: 2.2, sp: e.sp });
        }
      }
    }
  }

  // --- enemy bullets

    const p = EBL[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    let hit = false;
    if (Math.hypot(p.x - V.x, p.y - V.y) < pr + 4) {
      const nb = nearestBlock(p.x, p.y);
      if (nb.b && nb.d < CS * 0.62 + 4) { hitPlayer(nb.b, p.dmg, p.sp); hit = true; if (G.over) return; }
    }
    if (hit || p.life <= 0) swapRemove(EBL, i);
  }

  // --- deposits
  for (let i = DEP.length - 1; i >= 0; i--) {
    const dp = DEP[i];
    if (Math.hypot(dp.x - V.x, dp.y - V.y) < 44 + pr * 0.5) {
      dp.prog += dt / 1.6;
      if (dp.prog >= 1) {
        for (let j = 0; j < dp.amt; j++) { const an = rand(0, TAU); PK.push({ x: dp.x, y: dp.y, k: dp.res, amt: 1, vx: Math.cos(an) * rand(60, 160), vy: Math.sin(an) * rand(60, 160) }); }
        burst(dp.x, dp.y, 12, RES[dp.res].color, 160); snd(500, 0.12, 'triangle', 0.03);

      }

  }

  // --- pickups
  const mr = s.magnet;
  for (let i = PK.length - 1; i >= 0; i--) {
    const p = PK[i];
    const dx = V.x - p.x, dy = V.y - p.y, d = Math.hypot(dx, dy);
    if (d < mr) { const pull = 520 * (1 - d / mr) + 160; p.vx += (dx / (d || 1)) * pull * dt * 6; p.vy += (dy / (d || 1)) * pull * dt * 6; }
    p.vx *= 1 - Math.min(1, 4 * dt); p.vy *= 1 - Math.min(1, 4 * dt);
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (d < 22 + pr * 0.4) {
      if (p.k === 'xp') { G.xp += p.amt * (1 + G.mods.xp); checkLevel(); }
      else { G.loot[p.k] = (G.loot[p.k] || 0) + p.amt; }
      swapRemove(PK, i);
    }
  }

  // --- fx
  for (let i = FX.length - 1; i >= 0; i--) { const f = FX[i]; f.life -= dt; if (!f.ring) { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.94; f.vy *= 0.94; if (f.rot !== undefined) f.rot += f.vr * dt; } if (f.life <= 0) swapRemove(FX, i); }
  for (let i = BEAMS.length - 1; i >= 0; i--) { BEAMS[i].life -= dt; if (BEAMS[i].life <= 0) swapRemove(BEAMS, i); }
  if (shake > 0) shake = Math.max(0, shake - 30 * dt);
  if (V.flash > 0) V.flash -= dt;
}

/* ======================= Cards / level-up ======================= */
function validCells(list, Rlim) {
  const occ = new Set(list.map(b => b.x + ',' + b.y)); const out = [];
  for (const b of list) for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    const x = b.x + dx, y = b.y + dy, k = x + ',' + y;
    if (Math.abs(x) <= Rlim && Math.abs(y) <= Rlim && !occ.has(k)) { occ.add(k); out.push([x, y]); }
  }
  return out;
}
function makeCards() {
  const cards = []; const used = new Set();
  const weaponsOn = [...new Set(V.s.weapons.map(b => b.t))];
  const canPlace = validCells(V.list, save.gridR + 1).length > 0;
  let guard = 0;
  while (cards.length < 3 && guard++ < 80) {
    const r = R(); let c;
    if (r < 0.45 && canPlace) { const t = pick(PLACEABLE); c = { kind: 'block', t, key: 'b' + t, label: 'New block', title: B[t].name, desc: B[t].desc }; }
    else if (r < 0.8 && weaponsOn.length) { const t = pick(weaponsOn); const l = G.lvl[t] || 0; c = { kind: 'up', t, key: 'u' + t, label: 'Upgrade', title: B[t].name + ' Mk ' + roman(l + 2), desc: '+25% damage and +12% fire rate for every ' + B[t].name + '.' }; }
    else { const p = pick(PERKS); c = { kind: 'perk', p, key: 'p' + p.id, label: 'Perk', title: p.name, desc: p.desc }; }
    if (used.has(c.key)) continue; used.add(c.key); cards.push(c);
  }
  const damaged = V.list.some(b => b.hp < b.max * 0.55) || V.list.length < save.build.length;
  if (damaged && R() < 0.55) cards[cards.length - 1] = { kind: 'repair', key: 'repair', label: 'Repair', title: 'Field repair', desc: 'Restore every block to full HP.' };
  return cards;
}
function applyCard(c) {
  if (c.kind === 'block') { showPlacement(c.t); return; }
  if (c.kind === 'up') G.lvl[c.t] = (G.lvl[c.t] || 0) + 1;
  if (c.kind === 'perk') c.p.apply(G.mods);
  if (c.kind === 'repair') for (const b of V.list) b.hp = b.max;
  compileVehicle(V, G.mods);
  afterCard();
}
function afterCard() {
  G.pendingLevels = Math.max(0, G.pendingLevels - 1);
  if (G.pendingLevels > 0) showCards(); else setMode('run');
}

/* ======================= Rendering ======================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let DPR = 1, VW = 800, VH = 600;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = window.innerWidth || 800; VH = window.innerHeight || 600;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  if (G) { G.zoom = clamp(Math.min(VW, VH) / 620, 0.72, 1.6); G.spawnD = Math.hypot(VW, VH) / 2 / G.zoom + 70; }
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!G || !V) { ctx.fillStyle = '#1f262e'; ctx.fillRect(0, 0, cv.width, cv.height); return; }
  const Wd = WORLDS[G.wk];
  ctx.fillStyle = Wd.ground; ctx.fillRect(0, 0, cv.width, cv.height);
  const z = G.zoom * DPR;
  const shx = shake ? rand(-shake, shake) : 0, shy = shake ? rand(-shake, shake) : 0;
  const cx = V.x + shx, cy = V.y + shy;
  ctx.setTransform(z, 0, 0, z, cv.width / 2 - cx * z, cv.height / 2 - cy * z);
  const hw = cv.width / z / 2, hh = cv.height / z / 2;
  const x0 = cx - hw, x1 = cx + hw, y0 = cy - hh, y1 = cy + hh;
  const vis = (x, y, m) => x > x0 - m && x < x1 + m && y > y0 - m && y < y1 + m;

  // ground dots
  ctx.fillStyle = Wd.dot;
  const gs = 64;
  for (let gx = Math.floor(x0 / gs) * gs; gx < x1; gx += gs) for (let gy = Math.floor(y0 / gs) * gs; gy < y1; gy += gs) ctx.fillRect(gx - 1.5, gy - 1.5, 3, 3);
  // hazards
  ctx.fillStyle = Wd.haz;
  for (const zn of HZ) if (vis(zn.x, zn.y, zn.r)) { ctx.beginPath(); ctx.arc(zn.x, zn.y, zn.r, 0, TAU); ctx.fill(); }
  // arena border
  ctx.strokeStyle = 'rgba(246,195,68,0.35)'; ctx.lineWidth = 6; ctx.setLineDash([24, 18]);
  ctx.strokeRect(-ARENA, -ARENA, ARENA * 2, ARENA * 2); ctx.setLineDash([]);
  // deposits
  for (const dp of DEP) {
    if (!vis(dp.x, dp.y, 40)) continue;
    const c = RES[dp.res].color;
    ctx.fillStyle = c; ctx.globalAlpha = 0.9;
    ctx.beginPath();
    const rr = dp.cache ? 16 : 12;
    for (let i = 0; i < 6; i++) { const an = i / 6 * TAU + 0.3; const r2 = i % 2 ? rr * 0.6 : rr; ctx.lineTo(dp.x + Math.cos(an) * r2, dp.y + Math.sin(an) * r2); }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    if (dp.cache) { ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(dp.x, dp.y, 24, 0, TAU); ctx.stroke(); }
    if (dp.prog > 0) { ctx.strokeStyle = '#ece7dc'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(dp.x, dp.y, 20, -Math.PI / 2, -Math.PI / 2 + dp.prog * TAU); ctx.stroke(); }
  }
  // pickups
  for (const p of PK) {
    if (!vis(p.x, p.y, 10)) continue;
    if (p.k === 'xp') { ctx.fillStyle = '#4fa69a'; ctx.beginPath(); ctx.arc(p.x, p.y, 3 + Math.min(4, p.amt * 0.5), 0, TAU); ctx.fill(); }
    else { ctx.fillStyle = RES[p.k].color; ctx.fillRect(p.x - 4, p.y - 4, 8, 8); }
  }
  // enemies
  for (const e of E) {
    if (!vis(e.x, e.y, e.r + 4)) continue;
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.h + Math.PI / 2);
    const sc = e.sc * EC;
    for (const c of e.sp.cells) {
      ctx.fillStyle = e.flash > 0 ? '#ffffff' : EB[c[2]].color;
      ctx.fillRect(c[0] * sc - sc * 0.46, c[1] * sc - sc * 0.46, sc * 0.92, sc * 0.92);
    }
    if (e.burn > 0) { ctx.fillStyle = 'rgba(255,106,60,0.35)'; ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill(); }
    ctx.restore();
    if (e.isMini) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(e.x - 26, e.y - e.r - 12, 52, 5);
      ctx.fillStyle = '#c4533a'; ctx.fillRect(e.x - 26, e.y - e.r - 12, 52 * clamp(e.hp / e.max, 0, 1), 5);
    }
  }
  // enemy bullets
  ctx.fillStyle = '#ff5a5a';
  for (const p of EBL) { if (vis(p.x, p.y, 6)) { ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, TAU); ctx.fill(); } }
  // player projectiles
  for (const p of PB) {
    if (!vis(p.x, p.y, 70)) continue;
    if (p.lob) {
      ctx.strokeStyle = 'rgba(255,154,74,0.5)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.tx, p.ty, p.aoe * 0.5, 0, TAU); ctx.stroke();
      ctx.fillStyle = DCOL.explosive; ctx.beginPath(); ctx.arc(p.x, p.y - (p.z || 0), 5, 0, TAU); ctx.fill();
    } else if (p.type === 'fire') {
      ctx.fillStyle = 'rgba(255,110,50,' + clamp(p.life * 2, 0.15, 0.8) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    } else {
      ctx.strokeStyle = DCOL[p.type]; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.018, p.y - p.vy * 0.018); ctx.stroke();
    }
  }
  // beams
  for (const b of BEAMS) {
    ctx.globalAlpha = clamp(b.life / b.max, 0, 1); ctx.strokeStyle = b.c; ctx.lineWidth = b.glow ? b.w * 2.6 : b.w;
    if (b.glow) { ctx.globalAlpha *= 0.35; }
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1);
    if (b.zig) { const n = 4; for (let i = 1; i < n; i++) { const t = i / n; ctx.lineTo(lerp(b.x1, b.x2, t) + rand(-6, 6), lerp(b.y1, b.y2, t) + rand(-6, 6)); } }
    ctx.lineTo(b.x2, b.y2); ctx.stroke();
    if (b.glow) { ctx.globalAlpha = clamp(b.life / b.max, 0, 1); ctx.strokeStyle = '#f2edff'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  // vehicle
  ctx.save(); ctx.translate(V.x, V.y); ctx.rotate(V.h + Math.PI / 2);
  for (const b of V.list) {
    const d = B[b.t]; const px = b.x * CS, py = b.y * CS;
    ctx.fillStyle = b.fl > 0 ? '#ffffff' : d.color;
    ctx.fillRect(px - CS * 0.47, py - CS * 0.47, CS * 0.94, CS * 0.94);
    const hpf = b.hp / b.max;

    if (d.dir) {

    if (b.t === 'cab') { ctx.fillStyle = '#20252b'; ctx.fillRect(px - 4, py - CS * 0.38, 8, 4); }
  }
  ctx.restore();
  // fx
  for (const f of FX) {
    ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
    if (f.ring) { ctx.strokeStyle = f.c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.2 - f.life / f.max * 0.5), 0, TAU); ctx.stroke(); }

    else { ctx.fillStyle = f.c; ctx.fillRect(f.x - f.s / 2, f.y - f.s / 2, f.s, f.s); }
  }
  ctx.globalAlpha = 1;

  // ---- screen space
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (V.flash > 0) { ctx.fillStyle = 'rgba(196,83,58,' + (V.flash * 2) + ')'; ctx.fillRect(0, 0, VW, VH); }
  // offscreen boss arrow
  for (const e of E) {
    if (!e.bossLv) continue;
    const sx = (e.x - cx) * G.zoom + VW / 2, sy = (e.y - cy) * G.zoom + VH / 2;
    if (sx > 0 && sx < VW && sy > 0 && sy < VH) continue;

    const ex = clamp(sx, 30, VW - 30), ey = clamp(sy, 90, VH - 70);
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(an); ctx.fillStyle = '#c4533a';
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -9); ctx.lineTo(-8, 9); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  // joystick
  if (JOY.active && mode === 'run') {
    ctx.strokeStyle = 'rgba(236,231,220,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(JOY.ox, JOY.oy, 70, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(246,195,68,0.75)';
    ctx.beginPath(); ctx.arc(JOY.ox + JOY.x * 70, JOY.oy + JOY.y * 70, 26, 0, TAU); ctx.fill();
  }
}

    el('div', { class: 'howto' },
      el('p', null, 'Touch anywhere and drag to drive. Your machine turns toward your thumb. Every weapon fires on its own, but only inside its arc: a cannon facing backwards covers your retreat.'),
      el('p', null, 'Enemies drop experience (teal) and resources (squares). Drive over crystal deposits for 2 seconds to mine them. Each level-up offers three cards: a new block to bolt on, an upgrade, or a perk.'),
      el('p', null, 'Blocks that lose their connection to the cab break off. Armor next to a block takes 40% of its hits. Batteries next to Tesla coils add chains; cannons next to cannons fire faster.'),
      el('p', null, 'Survive 5:00, then destroy the apex to keep all loot. Dying keeps half. After every run the world breeds its most successful machines and grows resistant to your favourite damage type.'),
      el('p', null, 'In the garage, craft permanent blocks from resources and arrange them on the grid. Tap a placed weapon to turn it. Rustlands has scrap, Crystal Tundra has crystal, Magma Rift has pyro-ore.')),
    el('button', { class: 'btn primary', onclick: showHub }, 'Back')));
}
function showSaveTools() {
  setMode('hub');
  const ta = el('textarea', { 'aria-label': 'Save code' });
  ta.value = exportCode();
  const msg = el('p', { class: 'sub' }, 'Copy this code somewhere safe. Paste a code and tap Load to restore it.');
  show('solid', el('div', { class: 'wrap' },
    el('h2', null, 'Back up your save'), msg, ta,
    el('div', { class: 'row', style: 'margin-top:12px' },
      el('button', { class: 'btn', onclick: () => { ta.select(); try { navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = 'Copied to the clipboard.'; }, () => { msg.textContent = 'Select the text and copy it manually.'; }); } catch (e) { msg.textContent = 'Select the text and copy it manually.'; } } }, 'Copy code'),
      el('button', { class: 'btn', onclick: () => { try { importCode(ta.value); msg.textContent = 'Save loaded.'; } catch (e) { msg.textContent = 'That code could not be loaded: ' + e.message + '.'; } } }, 'Load code'),
      el('button', { class: 'btn ghost', onclick: () => { if (confirm('Start over? This deletes your progress on this device.')) { defaultSave(); persist(); showHub(); } } }, 'Start over'),
      el('button', { class: 'btn primary', onclick: showHub }, 'Back'))));
}

/* --- shared grid component --- */
function gridView(list, Rlim, opts) {
  const n = Rlim * 2 + 1;
  const csz = Math.floor(clamp((Math.min(VW, 560) - 70) / n - 4, 30, 64));
  const valid = new Set((opts.valid || []).map(c => c[0] + ',' + c[1]));
  const g = el('div', { class: 'bgrid', style: 'grid-template-columns:repeat(' + n + ',' + csz + 'px);--cs:' + csz + 'px' });
  for (let y = -Rlim; y <= Rlim; y++) for (let x = -Rlim; x <= Rlim; x++) {
    const b = list.find(o => o.x === x && o.y === y);
    let cell;
    if (b) {
      const d = B[b.t];
      cell = el('button', { class: 'cell blk' + (b.t === 'cab' ? ' cab' : '') + (opts.fresh === b ? ' fresh' : ''), style: 'background:' + d.color, 'aria-label': d.name + (d.dir ? ', facing ' + ['forward', 'right', 'back', 'left'][b.r] : ''), onclick: () => opts.onTap(x, y, b) }, d.ab);
      if (d.dir) cell.append(el('span', { class: 'arw', style: 'transform:rotate(' + (b.r * 90) + 'deg)' }));
      if (b.max && b.hp < b.max) cell.append(el('span', { class: 'hpb' }, el('i', { style: 'width:' + Math.max(0, b.hp / b.max * 100) + '%' })));
    } else {
      const ok = valid.has(x + ',' + y);
      cell = el('button', { class: 'cell' + (ok ? ' valid' : ''), 'aria-label': ok ? 'Place here' : 'Empty', onclick: () => opts.onTap(x, y, null) });
    }
    g.append(cell);
  }
  return el('div', null, el('div', { class: 'fwd' }, 'Front of the machine'), el('div', { class: 'gridwrap' }, g));
}

/* --- level-up cards --- */
function showCards() {
  setMode('cards');

  show('dim', el('div', { class: 'wrap mid' },
    el('h2', { class: 'center' }, 'Level ' + G.level + '. Choose one'),

      el('div', { class: 'kind' }, c.label), el('div', { class: 'ttl' }, c.title), el('div', { class: 'dsc' }, c.desc),
      c.kind === 'block' ? el('div', { class: 'dsc', style: 'color:var(--yellow)' }, 'Placed for this run') : null))),
    el('div', { class: 'row', style: 'justify-content:center;margin-top:16px' },
      el('button', { class: 'btn ghost', disabled: G.reroll <= 0, onclick: () => { G.reroll--; showCards(); } }, 'Reroll (' + G.reroll + ' left)'))));

}

/* --- placement (in run) --- */
function showPlacement(t, fresh) {
  setMode('place');
  const Rlim = save.gridR + 1;
  const valid = fresh ? [] : validCells(V.list, Rlim);
  const onTap = (x, y, b) => {
    if (!fresh && !b && valid.some(c => c[0] === x && c[1] === y)) {
      const nb = addBlock(V, x, y, t, 0);
      nb.cd = 0.2;
      compileVehicle(V, G.mods); snd(600, 0.12, 'triangle', 0.04);
      showPlacement(t, nb);
    } else if (b && B[b.t].dir) { b.r = (b.r + 1) % 4; compileVehicle(V, G.mods); showPlacement(t, fresh); }
  };
  show('dim', el('div', { class: 'wrap mid' },
    el('h2', { class: 'center' }, fresh ? B[t].name + ' placed' : 'Place your ' + B[t].name),
    el('p', { class: 'sub center', style: 'margin:0 auto 12px' }, fresh
      ? (B[t].dir ? 'Tap any weapon to turn it. The bar shows where it fires.' : 'Tap any weapon to turn it, or continue.')
      : 'Tap a highlighted slot next to your machine.'),
    gridView(V.list, Rlim, { valid, fresh, onTap }),
    el('div', { class: 'row', style: 'justify-content:center;margin-top:16px' },
      fresh ? el('button', { class: 'btn primary', onclick: afterCard }, 'Continue') : el('button', { class: 'btn ghost', onclick: afterCard }, 'Skip this block'))));
}

/* --- pause --- */
function showPause() {
  if (mode !== 'run') return;
  setMode('pause');
  show('dim', el('div', { class: 'wrap mid center' },
    el('h2', null, 'Paused'),
    el('p', { class: 'sub', style: 'margin:0 auto 16px' }, WORLDS[G.wk].name + ', ' + fmtTime(G.t) + ' survived, ' + G.kills + ' kills.'),
    el('div', { class: 'row', style: 'justify-content:center' },
      el('button', { class: 'btn primary', onclick: () => setMode('run') }, 'Resume'),
      el('button', { class: 'btn', onclick: () => { save.muted = !save.muted; persist(); setMode('run'); showPause(); } }, save.muted ? 'Sound off' : 'Sound on'),
      el('button', { class: 'btn ghost', onclick: () => endRun(false) }, 'Abandon run (keep half)')),
    el('div', { style: 'text-align:left;max-width:640px;margin:22px auto 0' }, el('h2', null, 'Damage so far'), damageReport(G.dmgBy, G.killsSrc, G.peak, G.t))));
}

/* --- damage report --- */
function damageReport(dmg, ks, peak, t) {
  const keys = Object.keys(dmg).filter(k => dmg[k] >= 1).sort((a, b) => dmg[b] - dmg[a]);
  if (!keys.length) return el('p', { class: 'sub' }, 'No damage dealt.');
  const total = keys.reduce((a, k) => a + dmg[k], 0), top = dmg[keys[0]];
  return el('div', { class: 'log rep' },
    keys.map(k => el('div', { class: 'rrow' },
      el('div', { class: 'nm' }, el('span', { class: 'dot', style: 'background:' + B[k].color }), B[k].name + (peak[k] > 1 ? ' ×' + peak[k] : '')),
      el('div', { class: 'track' }, el('div', { class: 'fill', style: 'background:' + B[k].color + ';width:' + Math.max(2, dmg[k] / top * 100).toFixed(1) + '%' })),
      el('div', { class: 'num' }, el('b', null, Math.round(dmg[k] / total * 100) + '%'), ' ' + Math.round(dmg[k] / Math.max(1, t)) + '/s, ' + (ks[k] || 0) + ' kills'))),
    el('div', { style: 'color:var(--muted);font-size:13px;margin-top:4px' }, 'Total ' + Math.round(total).toLocaleString('en') + ' damage, ' + Math.round(total / Math.max(1, t)) + ' per second. Per-second values are averaged over the whole run.'));
}

/* --- debrief --- */
function showDebrief(r) {
  setMode('debrief');
  const keys = Object.keys(r.gained);
  show('solid', el('div', { class: 'wrap' },
    el('h1', null, r.won ? 'Apex destroyed' : 'Machine destroyed'),
    el('p', { class: 'sub' }, WORLDS[r.wk].name + '. Survived ' + fmtTime(r.t) + ', level ' + r.level + ', ' + r.kills + ' kills. ' + (r.won ? 'All loot kept.' : 'Half of the loot was salvaged.')),
    el('h2', null, 'Loot banked'),
    keys.length ? resChips(r.gained, true) : el('p', { class: 'sub' }, 'Nothing salvaged this time.'),
    el('h2', null, 'Damage report'),
    damageReport(r.dmg, r.ks, r.peak, r.t),
    el('p', { class: 'sub', style: 'margin-top:8px' }, 'Your machine took ' + Math.round(r.taken).toLocaleString('en') + ' damage.'),
    el('h2', null, 'How ' + WORLDS[r.wk].name + ' evolved'),
    el('div', { class: 'log' }, r.report.length ? r.report.map(l => el('div', null, l)) : el('div', null, 'No changes.')),
    el('div', { class: 'row', style: 'margin-top:18px' },
      el('button', { class: 'btn primary', onclick: showGarage }, 'Open garage'),
      el('button', { class: 'btn', onclick: () => startRun(r.wk) }, 'Run it again'),
      el('button', { class: 'btn ghost', onclick: showHub }, 'World map'))));
}

/* --- garage --- */
let gTool = null;
function garageStats() {
  const v = makeVehicle(save.build); const s = compileVehicle(v, freshMods());
  const warn = [];
  if (!s.thrust) warn.push('No propulsion: add wheels, tracks or hover pads.');
  if (s.powerFactor < 1) warn.push('Power overload: weapons fire at ' + Math.round(s.powerFactor * 100) + '%. Add batteries.');
  if (!s.weapons.length) warn.push('No weapons.');
  return el('div', { class: 'stats' },
    el('div', null, 'Top speed ', el('b', null, Math.round(s.speed)), ', mass ', el('b', null, s.mass.toFixed(1)), ', turn ', el('b', null, s.turn.toFixed(1))),
    el('div', null, 'Power ', el('b', null, s.power + ' supply / ' + s.demand + ' demand'), ', pickup range ', el('b', null, s.magnet)),
    el('div', null, 'Weapons ', el('b', null, s.weapons.length), ', total HP ', el('b', null, v.list.reduce((a, b) => a + b.max, 0))),
    warn.map(w => el('div', { class: 'warn' }, w)));
}
function garageTap(x, y, b) {
  const list = save.build;
  if (gTool === 'remove') {
    if (b && b.t !== 'cab') {
      list.splice(list.indexOf(b), 1); save.inv[b.t] = (save.inv[b.t] || 0) + 1;
      const v = makeVehicle(list); const keep = reachable(v);
      const lostKeys = new Set(v.list.filter(o => !keep.has(o)).map(o => o.x + ',' + o.y));
      for (let i = list.length - 1; i >= 0; i--) if (lostKeys.has(list[i].x + ',' + list[i].y)) { save.inv[list[i].t] = (save.inv[list[i].t] || 0) + 1; list.splice(i, 1); }
      if (lostKeys.size) toast(lostKeys.size + ' disconnected block' + (lostKeys.size > 1 ? 's' : '') + ' returned to storage', 1800);
      persist();
    }
  } else if (gTool && B[gTool]) {
    if (!b && (save.inv[gTool] || 0) > 0 && validCells(list, save.gridR).some(c => c[0] === x && c[1] === y)) {
      list.push({ x, y, t: gTool, r: 0 }); save.inv[gTool]--; if (save.inv[gTool] <= 0) { delete save.inv[gTool]; gTool = null; }
      persist();
    } else if (b && B[b.t].dir) { b.r = (b.r + 1) % 4; persist(); }
  } else if (b && B[b.t].dir) { b.r = (b.r + 1) % 4; persist(); }
  showGarage(true);
}
function showGarage(keepScroll) {
  G = null; V = null;
  setMode('garage');
  const st = keepScroll ? ui.scrollTop : 0;
  const valid = gTool && B[gTool] && (save.inv[gTool] || 0) > 0 ? validCells(save.build, save.gridR) : [];
  const invKeys = PLACEABLE.filter(t => (save.inv[t] || 0) > 0);
  const tools = el('div', { class: 'tools' },
    invKeys.map(t => el('button', { class: 'tool' + (gTool === t ? ' sel' : ''), onclick: () => { gTool = gTool === t ? null : t; showGarage(true); } },
      el('span', { class: 'sw', style: 'background:' + B[t].color }), B[t].name + (upL(t) ? ' Mk ' + roman(upL(t) + 1) : '') + ' × ' + save.inv[t])),
    el('button', { class: 'tool' + (gTool === 'remove' ? ' sel' : ''), onclick: () => { gTool = gTool === 'remove' ? null : 'remove'; showGarage(true); } }, 'Remove blocks'));
  const hint = gTool === 'remove' ? 'Tap a block to put it back into storage.'
    : gTool ? 'Tap a highlighted slot to place the ' + B[gTool].name + '.'
    : invKeys.length ? 'Pick a block from storage, then tap a slot. Tap a weapon on the grid to turn it.' : 'Storage is empty. Craft blocks on the right. Tap a weapon to turn it.';
  const nextGrid = save.gridR === 2 ? { r: 3, cost: { shard: 3, scrap: 150 } } : save.gridR === 3 ? { r: 4, cost: { shard: 10, scrap: 400, copper: 100 } } : null;
  const craft = el('div', { class: 'craft' },
    nextGrid ? el('div', { class: 'crow' }, el('div', { class: 'nm' }, 'Bigger build grid', el('div', null, 'Expand to ' + (nextGrid.r * 2 + 1) + '×' + (nextGrid.r * 2 + 1) + '. In a run you can always build one ring further.'), costChips(nextGrid.cost)),
      el('button', { class: 'btn', disabled: !canAfford(nextGrid.cost), onclick: () => { pay(nextGrid.cost); save.gridR = nextGrid.r; persist(); showGarage(true); } }, 'Expand')) : null,
    PLACEABLE.map(t => el('div', { class: 'crow' },
      el('span', { class: 'sw', style: 'width:18px;height:18px;border-radius:5px;background:' + B[t].color }),
      el('div', { class: 'nm' }, B[t].name + (save.inv[t] ? ' (' + save.inv[t] + ' stored)' : ''), el('div', null, B[t].desc), costChips(B[t].cost)),
      el('button', { class: 'btn', disabled: !canAfford(B[t].cost), onclick: () => { pay(B[t].cost); save.inv[t] = (save.inv[t] || 0) + 1; persist(); snd(520, 0.1, 'triangle', 0.03); showGarage(true); } }, 'Craft'))));
  const owned = ['cab'].concat(PLACEABLE.filter(t => save.build.some(b => b.t === t) || (save.inv[t] || 0) > 0));
  const shop = el('div', { class: 'craft' }, owned.map(t => {
    const L = upL(t), max = L >= UP_MAX, cost = max ? null : upCost(t);
    return el('div', { class: 'crow' },
      el('span', { class: 'sw', style: 'width:18px;height:18px;border-radius:5px;background:' + B[t].color }),
      el('div', { class: 'nm' }, B[t].name, el('span', { class: 'mk' }, 'Mk ' + roman(L + 1)), el('div', null, max ? 'Fully upgraded.' : upEffect(t) + '.'), cost ? costChips(cost) : null),
      max ? null : el('button', { class: 'btn', disabled: !canAfford(cost), onclick: () => { pay(cost); save.up[t] = L + 1; persist(); snd(660, 0.15, 'triangle', 0.035); toast(B[t].name + ' upgraded to Mk ' + roman(L + 2), 1400); showGarage(true); } }, 'Upgrade'));
  }));
  show('solid', el('div', { class: 'wrap' },
    el('div', { class: 'row', style: 'justify-content:space-between' }, el('h1', null, 'Garage'), el('button', { class: 'btn primary', onclick: showHub }, 'Done')),
    resChips(save.res),
    el('div', { class: 'garage', style: 'margin-top:14px' },
      el('div', null, gridView(save.build, save.gridR, { valid, onTap: garageTap }), el('p', { class: 'sub', style: 'margin:10px 0 0' }, hint), tools, garageStats()),
      el('div', null, el('h2', { style: 'margin-top:0' }, 'Workshop upgrades'), el('p', { class: 'sub', style: 'margin:-4px 0 10px' }, 'Permanent. Applies to every block of that type, in every run.'), shop,
        el('h2', null, 'Craft blocks'), craft))));
  if (keepScroll) ui.scrollTop = st;
}

/* ======================= Input ======================= */
cv.addEventListener('pointerdown', e => {
  audioUnlock();
  if (mode !== 'run' || JOY.active) return;
  JOY.active = true; JOY.id = e.pointerId; JOY.ox = e.clientX; JOY.oy = e.clientY; JOY.x = 0; JOY.y = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  e.preventDefault();
}, { passive: false });
cv.addEventListener('pointermove', e => {
  if (!JOY.active || e.pointerId !== JOY.id) return;
  let dx = e.clientX - JOY.ox, dy = e.clientY - JOY.oy; const len = Math.hypot(dx, dy), max = 70;
  if (len > max) { JOY.ox = e.clientX - dx / len * max; JOY.oy = e.clientY - dy / len * max; dx = dx / len * max; dy = dy / len * max; }
  const m = Math.hypot(dx, dy) / max;
  if (m < 0.08) { JOY.x = 0; JOY.y = 0; } else { JOY.x = dx / max; JOY.y = dy / max; }
  e.preventDefault();
}, { passive: false });
function joyEnd(e) { if (e.pointerId === JOY.id) { JOY.active = false; JOY.x = 0; JOY.y = 0; JOY.id = -1; } }
cv.addEventListener('pointerup', joyEnd);
cv.addEventListener('pointercancel', joyEnd);
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'p') { if (mode === 'run') showPause(); else if (mode === 'pause') setMode('run'); } });
// keyboard driving for desktop testing
const KEYS = {};
document.addEventListener('keydown', e => { KEYS[e.key.toLowerCase()] = true; });
document.addEventListener('keyup', e => { KEYS[e.key.toLowerCase()] = false; });
function keyboardJoy() {
  if (JOY.active) return;
  const x = (KEYS.d || KEYS.arrowright ? 1 : 0) - (KEYS.a || KEYS.arrowleft ? 1 : 0);
  const y = (KEYS.s || KEYS.arrowdown ? 1 : 0) - (KEYS.w || KEYS.arrowup ? 1 : 0);
  const l = Math.hypot(x, y); JOY.x = l ? x / l : 0; JOY.y = l ? y / l : 0;
}
$('pauseBtn').addEventListener('click', () => showPause());
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'run') showPause(); });
window.addEventListener('resize', resize);

/* ======================= Main loop ======================= */
let acc = 0, last = 0;
function frame(now) {
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0; last = now;
  if (mode === 'run' && G && !G.over) {
    keyboardJoy();
    acc += dt; let n = 0;
    while (acc >= STEP && n < 6) { update(STEP); acc -= STEP; n++; if (!G || G.over || G.pendingLevels > 0) break; }
    if (n >= 6) acc = 0;
    if (G && !G.over && G.pendingLevels > 0 && mode === 'run') { acc = 0; showCards(); }
  }
  render();
  hudT += dt; if (hudT > 0.1) { hudT = 0; if (G && (mode === 'run' || mode === 'pause')) updateHUD(); }
  requestAnimationFrame(frame);
}

loadSave();
resize();
showHub();
requestAnimationFrame(frame);
</script>
